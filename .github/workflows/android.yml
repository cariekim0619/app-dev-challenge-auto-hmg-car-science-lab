name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make the wrapper executable
        run: chmod +x gradlew

      # 학습 엔진과 진행 제어, 콘텐츠 검증은 Android 없이 도는 JVM 테스트다.
      - name: Run unit tests
        run: ./gradlew testSimulationDebugUnitTest testPleosDebugUnitTest --stacktrace

      # simulation은 모의 입력 빌드, pleos는 실제 Vehicle SDK를 쓰는 차량 빌드다.
      - name: Build debug APKs
        run: ./gradlew assembleSimulationDebug assemblePleosDebug --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: car-science-lab-debug-apks
          path: app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
